name: Android CI

# Ne plus builder à chaque push (évite le spam GitHub sur la branche improvements).
# Build déclenché uniquement sur PR ou manuellement.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./OpenTapoWearOs


    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      run: |
        ./gradlew :app:assembleDebug :mobile:assembleDebug --no-daemon
